      - id: B3
        titre: "Autonomie et garde-fous d'action"
        objectif: "Borner ce qu'un agent peut faire seul, et pouvoir l'arrêter immédiatement."
        controles:
          - id: B3.1
            question: "Les actions de chaque agent sont classées par impact (lecture, écriture réversible, irréversible, externe). Les actions irréversibles ou à fort impact (suppression, paiement, envoi externe, changement de droits, mise en production) exigent une validation humaine portant sur l'action exacte."
