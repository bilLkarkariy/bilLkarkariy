# Grille d'audit « état des lieux » — Red Team IA
# Source unique : l'Excel et le Markdown sont générés par tools/build_grille.py.
# Les identifiants de référentiels sont vérifiés dans data/referentiels.yaml.
meta:
  titre: "Grille d'audit « état des lieux » — Red Team IA"
  version: "1.0"
  date: "2026-11-05"
  echelle_maturite:
    - {niveau: 0, libelle: "Inexistant", definition: "Aucune pratique, ou pratique inconnue des interlocuteurs."}
    - {niveau: 1, libelle: "Initial", definition: "Pratique ponctuelle, dépendante de personnes, non documentée."}
    - {niveau: 2, libelle: "Défini", definition: "Pratique documentée, mais appliquée partiellement ou sans preuve."}
    - {niveau: 3, libelle: "Maîtrisé", definition: "Pratique appliquée sur tout le périmètre, preuves disponibles."}
    - {niveau: 4, libelle: "Optimisé", definition: "Pratique mesurée, testée (exercice, red team) et améliorée en continu."}
  criticite:
    - {poids: 3, libelle: "Critique", definition: "Défaillance exploitable directement ou à impact majeur ; vecteur observé lors de Black October."}
    - {poids: 2, libelle: "Important", definition: "Défaillance qui aggrave fortement un incident ou en retarde la détection."}
    - {poids: 1, libelle: "Utile", definition: "Bonne pratique de maturité ; impact indirect."}
  seuils:
    - {min: 0.00, libelle: "Critique", couleur: "D03B3B"}
    - {min: 0.25, libelle: "Fragile", couleur: "EC835A"}
    - {min: 0.50, libelle: "Intermédiaire", couleur: "FAB219"}
    - {min: 0.75, libelle: "Robuste", couleur: "0CA30C"}
  reponses_flash:
    - {reponse: "Oui", points: 2}
    - {reponse: "Partiel", points: 1}
    - {reponse: "Non", points: 0}
    - {reponse: "Ne sait pas", points: 0}

surfaces:
  - id: A
    titre: "Surface A — Failles accélérées par l'IA"
    resume: "La surface classique (applications, équipements, dépendances, identités), désormais découverte et exploitée à vitesse machine."
    domaines:
      - id: A1
        titre: "Inventaire et surface d'exposition"
        objectif: "Savoir ce qui est exposé avant qu'un agent de reconnaissance autonome ne le découvre."
        controles:
          - id: A1.1
            question: "L'inventaire des actifs exposés sur Internet (domaines, sous-domaines, adresses IP, applications web, API, interfaces d'administration) est exhaustif, couvre filiales et prestataires, et est mis à jour au moins mensuellement."
            preuves: "Export daté de l'inventaire ou de l'outil de gestion de surface d'attaque ; écart mesuré entre l'inventaire et la découverte externe réalisée par l'auditeur."
            methode: "Revue documentaire ; test technique (découverte passive puis active dans le périmètre autorisé)"
            criticite: 3
            flash: true
            question_flash: "Avez-vous un inventaire à jour (moins d'un mois) de tout ce que vous exposez sur Internet, filiales et prestataires compris ?"
            refs: {nist_csf: [ID.AM-01, ID.AM-02], atlas: [AML.T0116, AML.T0006]}
            cas: [ECOM-AGENTS, TAIWAN-MULTIAGENT]
          - id: A1.2
            question: "Pour chaque application exposée, la pile technique et ses versions (langage et environnement d'exécution comme PHP, framework, CMS, serveur web) sont connues, ce qui permet de répondre en moins de 4 heures à la question « sommes-nous exposés à cette CVE ? »."
            preuves: "Inventaire logiciel (SBOM ou CMDB) ; exercice chronométré sur une CVE récente, par exemple CVE-2026-109618 / CVE-2026-109619."
            methode: "Exercice chronométré ; revue documentaire"
            criticite: 3
            flash: true
            question_flash: "Le jour où une faille critique comme PHP2Shell est publiée, savez-vous en moins de 4 heures quels serveurs sont concernés ?"
            refs: {nist_csf: [ID.AM-02, ID.RA-01], atlas: [AML.T0049]}
            cas: [PHP2SHELL]
          - id: A1.3
            question: "Les équipements de bordure et embarqués (pare-feu, VPN, routeurs, NAS, caméras, objets connectés, appliances) sont inventoriés avec leur firmware et leurs composants logiciels, et leurs interfaces d'administration ne sont pas exposées sur Internet."
            preuves: "Inventaire des équipements avec versions de firmware ; résultat du scan des interfaces d'administration exposées."
            methode: "Revue documentaire ; test technique"
            criticite: 3
            flash: false
            refs: {nist_csf: [ID.AM-01, PR.PS-03, PR.IR-01], atlas: [AML.T0049, AML.T0122]}
            cas: [PHP2SHELL-EMBARQUE]
          - id: A1.4
            question: "Les services d'IA exposés (points d'accès de modèles, passerelles LLM, notebooks, serveurs MCP, consoles d'agents) figurent dans l'inventaire et aucun n'est accessible publiquement sans authentification."
            preuves: "Liste des services d'IA exposés ; tests d'accès anonymes réalisés par l'auditeur."
            methode: "Test technique ; revue documentaire"
            criticite: 2
            flash: false
            refs: {nist_csf: [ID.AM-02, PR.AA-03], atlas: [AML.T0132, AML.T0006.002]}
            cas: []
          - id: A1.5
            question: "Une surveillance continue de la surface externe alerte sur toute nouvelle exposition (sous-domaine, port, certificat, service) en moins de 24 heures."
            preuves: "Configuration de l'outil de surveillance ; exemples d'alertes récentes et délais de traitement."
            methode: "Revue documentaire ; échantillonnage"
            criticite: 2
            flash: false
            refs: {nist_csf: [DE.CM-01, ID.AM-01], atlas: [AML.T0116]}
            cas: [ECOM-AGENTS]

      - id: A2
        titre: "Vulnérabilités et vélocité de correctif"
        objectif: "Tenir la cadence quand le volume de failles critiques explose : l'asymétrie entre découverte par la machine et correction par l'humain."
        controles:
          - id: A2.1
            question: "Des délais maximaux de correction sont définis par criticité et par exposition (par exemple 24 à 48 heures pour une faille critique exploitée ou exposée sur Internet) ; le délai réel est mesuré et respecté."
            preuves: "Politique de gestion des vulnérabilités ; délais réels de correction sur les 6 derniers mois ; taux de respect."
            methode: "Revue documentaire ; échantillonnage"
            criticite: 3
            flash: true
            question_flash: "Mesurez-vous le délai réel entre la publication d'une faille critique et son correctif en production ? Est-il inférieur à 72 heures ?"
            refs: {nist_csf: [ID.RA-01, PR.PS-02]}
            cas: [PHP2SHELL, VOLUME-CRITIQUES]
          - id: A2.2
            question: "Une procédure de crise pour les correctifs existe : veille CERT-FR et éditeurs, décision de mise hors ligne préventive, mesures compensatoires (filtrage applicatif, désactivation de fonctionnalité), communication. Elle a été exercée dans les 12 derniers mois."
            preuves: "Procédure ; compte rendu d'exercice ou retour d'expérience sur PHP2Shell."
            methode: "Revue documentaire ; entretien"
            criticite: 3
            flash: true
            question_flash: "Avez-vous une procédure, déjà exercée, pour décider en quelques heures de couper ou protéger un service exposé à une faille critique ?"
            refs: {nist_csf: [ID.RA-02, RS.MA-01, ID.IM-04]}
            cas: [PHP2SHELL]
          - id: A2.3
            question: "La priorisation s'appuie sur l'exploitabilité réelle (catalogue KEV de la CISA, score EPSS, avis CERT-FR, exposition Internet) et pas uniquement sur le score CVSS."
            preuves: "Règles de priorisation ; exemples de tickets montrant l'usage de ces critères."
            methode: "Revue documentaire ; échantillonnage"
            criticite: 2
            flash: false
            refs: {nist_csf: [ID.RA-05, ID.RA-02]}
            cas: []
          - id: A2.4
            question: "La capacité de correction est dimensionnée pour absorber un pic (trois à dix fois plus de vulnérabilités critiques en un mois) : astreinte, automatisation du déploiement, renfort externe contractualisé à l'avance."
            preuves: "Plan de capacité ; chiffres et délais du dernier pic ; contrats de renfort."
            methode: "Entretien ; revue documentaire"
            criticite: 2
            flash: false
            refs: {nist_csf: [ID.RA-05, PR.PS-02, GV.RR-02]}
            cas: [VOLUME-CRITIQUES, GOULOT-VALIDATION]
          - id: A2.5
            question: "Un processus de réception des signalements de vulnérabilités existe (fichier security.txt, politique de divulgation coordonnée) et peut absorber des signalements produits en masse par des outils d'IA."
            preuves: "security.txt publié ; politique de divulgation ; volumétrie et délais de traitement des signalements."
            methode: "Test technique ; revue documentaire"
            criticite: 1
            flash: false
            refs: {nist_csf: [ID.RA-08, RS.MA-02]}
            cas: [GOULOT-VALIDATION]

      - id: A3
        titre: "Chaîne d'approvisionnement logicielle (dont bibliothèques d'IA)"
        objectif: "Empêcher qu'une dépendance compromise (paquet, action CI, outil de prestataire) n'ouvre la porte aux secrets et aux clés d'API."
        controles:
          - id: A3.1
            question: "Les dépendances de chaque application en production sont inventoriées (SBOM), y compris les bibliothèques d'IA : SDK de modèles, passerelles LLM de type LiteLLM, frameworks d'agents."
            preuves: "SBOM par application ; liste des bibliothèques d'IA en production."
            methode: "Revue documentaire ; test technique (analyse de composition)"
            criticite: 3
            flash: true
            question_flash: "Pouvez-vous lister en une heure toutes les applications qui utilisent une bibliothèque donnée (par exemple LiteLLM), versions comprises ?"
            refs: {nist_csf: [ID.AM-02, GV.SC-07], owasp_llm: ["LLM03:2025"], atlas: [AML.T0010.001, AML.M0023]}
            cas: [LITELLM]
          - id: A3.2
            question: "Les dépendances sont épinglées avec vérification d'intégrité (fichiers de verrouillage, empreintes), installées depuis un miroir interne avec quarantaine des nouvelles versions et détection des paquets malveillants."
            preuves: "Fichiers de verrouillage ; configuration du miroir ou du proxy de paquets ; règles de quarantaine."
            methode: "Revue documentaire ; test technique"
            criticite: 3
            flash: true
            question_flash: "Une nouvelle version piégée d'une bibliothèque publiée ce matin sur PyPI ou npm pourrait-elle arriver automatiquement dans vos builds ?"
            refs: {nist_csf: [ID.RA-09, PR.PS-01], owasp_llm: ["LLM03:2025"], atlas: [AML.T0011.001, AML.T0010.001]}
            cas: [LITELLM]
          - id: A3.3
            question: "Les chaînes CI/CD sont durcies : actions et outils tiers épinglés par empreinte de commit, secrets à portée minimale et éphémères (fédération OIDC), séparation build et publication, artefacts signés avec provenance."
            preuves: "Définitions des pipelines ; inventaire des secrets CI ; politique de signature."
            methode: "Revue de configuration"
            criticite: 3
            flash: false
            refs: {nist_csf: [PR.PS-06, PR.AA-05], atlas: [AML.T0010.001]}
            cas: [LITELLM]
          - id: A3.4
            question: "Les noms de paquets internes sont protégés contre la confusion de dépendances (noms réservés sur les registres publics, registres privés prioritaires)."
            preuves: "Liste des paquets internes ; vérification de leur réservation sur les registres publics."
            methode: "Test technique"
            criticite: 2
            flash: false
            refs: {nist_csf: [ID.RA-09], atlas: [AML.T0010.001, AML.T0011.001]}
            cas: [EVALS-ANTHROPIC]
          - id: A3.5
            question: "Les outils d'administration à distance et les prestataires infogérés (RMM, MSP, éditeurs SaaS) sont évalués ; leurs accès sont nominatifs, limités et surveillés ; un plan existe en cas de compromission du fournisseur."
            preuves: "Registre des prestataires à accès privilégié ; clauses contractuelles ; journaux d'accès des prestataires."
            methode: "Revue documentaire ; échantillonnage"
            criticite: 2
            flash: false
            refs: {nist_csf: [GV.SC-07, GV.SC-08, DE.CM-06]}
            cas: [STORM-0940]
          - id: A3.6
            question: "Les dépendances proposées par des assistants d'IA sont vérifiées avant installation (existence, ancienneté, réputation, mainteneur) pour éviter les paquets « hallucinés » que des attaquants enregistrent à l'avance."
            preuves: "Règle de développement ; contrôle automatique des nouvelles dépendances en CI."
            methode: "Revue documentaire ; test technique"
            criticite: 2
            flash: false
            refs: {owasp_llm: ["LLM09:2025", "LLM03:2025"], nist_csf: [ID.RA-09], atlas: [AML.T0060, AML.T0062]}
            cas: []

      - id: A4
        titre: "Identités humaines et accès"
        objectif: "Résister aux attaques d'identifiants menées à un débit que seuls des agents automatisés atteignent."
        controles:
          - id: A4.1
            question: "Une authentification multifacteur résistante au phishing (FIDO2, clés d'accès, carte à puce) est imposée aux administrateurs et aux accès distants ; les protocoles d'authentification hérités sont désactivés."
            preuves: "Politiques d'accès conditionnel ; rapport de couverture MFA ; état des protocoles hérités."
            methode: "Revue de configuration"
            criticite: 3
            flash: true
            question_flash: "Vos administrateurs et accès distants utilisent-ils tous une MFA résistante au phishing, protocoles hérités désactivés ?"
            refs: {nist_csf: [PR.AA-03], atlas: [AML.T0012]}
            cas: [STORM-0940]
          - id: A4.2
            question: "Les attaques par pulvérisation de mots de passe et par bourrage d'identifiants à haut débit sont détectées et freinées (limitation de débit, verrouillage intelligent, alertes sur volumes anormaux par locataire)."
            preuves: "Règles de détection ; alertes des 3 derniers mois ; seuils configurés."
            methode: "Revue de configuration ; test technique (contrôlé)"
            criticite: 3
            flash: false
            refs: {nist_csf: [DE.CM-01, DE.CM-03], atlas: [AML.T0012]}
            cas: [STORM-0940]
          - id: A4.3
            question: "Les comptes à privilèges sont cloisonnés (modèle en tiers, comptes d'administration dédiés, accès juste-à-temps) et les chemins d'attaque vers l'administration du domaine et du cloud sont cartographiés puis réduits."
            preuves: "Cartographie des chemins d'attaque (type graphe AD/Entra) ; nombre de comptes à privilèges ; politique d'accès juste-à-temps."
            methode: "Test technique (collecte en lecture seule) ; revue documentaire"
            criticite: 3
            flash: false
            refs: {nist_csf: [PR.AA-05], atlas: [AML.T0090, AML.T0091]}
            cas: [CROWDSTRIKE-AGENTS]
          - id: A4.4
            question: "Les droits sont revus au moins tous les six mois et les comptes inactifs ou orphelins sont désactivés."
            preuves: "Comptes rendus de revue des droits ; statistiques des comptes inactifs."
            methode: "Échantillonnage"
            criticite: 1
            flash: false
            refs: {nist_csf: [PR.AA-01, PR.AA-05]}
            cas: []

      - id: A5
        titre: "Cryptographie et PKI : les fondamentaux"
        objectif: "Rappel de Black October : une partie des failles du mois venaient d'erreurs humaines élémentaires, pas de l'IA."
        controles:
          - id: A5.1
            question: "Les certificats et clés (TLS, signature de code, PKI interne) sont inventoriés avec propriétaire, algorithme, taille de clé et date d'expiration."
            preuves: "Inventaire des certificats ; rapport d'outil de découverte."
            methode: "Revue documentaire ; test technique"
            criticite: 2
            flash: false
            refs: {nist_csf: [ID.AM-08, PR.DS-01]}
            cas: [EMUDHRA]
          - id: A5.2
            question: "Les clés sont générées avec des générateurs d'aléa conformes, protégées (HSM ou coffre-fort de secrets) et leur qualité est contrôlée (clés faibles, réutilisées ou trop courtes)."
            preuves: "Procédure de génération ; résultats de contrôle de qualité des clés."
            methode: "Revue documentaire ; test technique"
            criticite: 2
            flash: false
            refs: {nist_csf: [PR.DS-01]}
            cas: [EMUDHRA]
          - id: A5.3
            question: "La dépendance aux autorités de certification tierces est maîtrisée : renouvellement automatisé (ACME) et plan de remplacement si une autorité est révoquée ou n'est plus reconnue."
            preuves: "Liste des AC utilisées ; plan de bascule ; taux d'automatisation."
            methode: "Entretien ; revue documentaire"
            criticite: 1
            flash: false
            refs: {nist_csf: [GV.SC-07, ID.AM-08]}
            cas: [EMUDHRA]

      - id: A6
        titre: "Détection et réponse à vitesse machine"
        objectif: "Détecter et contenir avant qu'un agent attaquant passe de l'accès initial à l'administration du domaine."
        controles:
          - id: A6.1
            question: "La détection et la réponse couvrent 24 h/24 et 7 j/7 les actifs exposés et les identités (SOC interne ou service managé), avec une prise en charge des alertes critiques en moins d'une heure."
            preuves: "Contrat ou organisation SOC ; délais de prise en charge mesurés ; périmètre couvert."
            methode: "Revue documentaire ; échantillonnage"
            criticite: 3
            flash: true
            question_flash: "Une alerte critique déclenchée un samedi à 3 h du matin est-elle prise en charge en moins d'une heure ?"
            refs: {nist_csf: [DE.CM-01, DE.CM-09, RS.MA-01]}
            cas: [ECOM-AGENTS, CROWDSTRIKE-AGENTS]
          - id: A6.2
            question: "Les journaux (web, identité, EDR, cloud, DNS) sont centralisés, horodatés de façon cohérente et conservés assez longtemps pour une investigation a posteriori (12 mois recommandés)."
            preuves: "Architecture de journalisation ; durées de conservation par source."
            methode: "Revue de configuration"
            criticite: 2
            flash: false
            refs: {nist_csf: [PR.PS-04, DE.AE-03]}
            cas: []
          - id: A6.3
            question: "Des scénarios de détection visent les attaques automatisées : rafales d'exploitation multi-cibles, enchaînement rapide reconnaissance → exploitation, trafic de serveurs vers des API de modèles d'IA, outillage d'agents (MCP, frameworks) sur des hôtes non autorisés."
            preuves: "Règles de détection correspondantes ; résultats de tests de détection."
            methode: "Revue de configuration ; test technique (émulation)"
            criticite: 2
            flash: false
            refs: {nist_csf: [DE.AE-02, DE.CM-09], atlas: [AML.T0124, AML.T0103, AML.T0096]}
            cas: [CROWDSTRIKE-AGENTS, TAIWAN-MULTIAGENT, HERMES-DEEPSEEK]
          - id: A6.4
            question: "Le plan de réponse à incident est testé chaque année par un exercice de crise incluant un scénario d'attaque automatisée massive, la décision d'isolement et les notifications réglementaires (RGPD, NIS2, DORA selon le cas)."
            preuves: "Plan de réponse ; compte rendu du dernier exercice et actions correctives."
            methode: "Revue documentaire ; entretien"
            criticite: 2
            flash: false
            refs: {nist_csf: [RS.MA-01, ID.IM-02, RS.CO-02]}
            cas: []

      - id: A7
        titre: "Sauvegardes et résilience"
        objectif: "Garantir qu'aucune identité, humaine ou agent, ne peut détruire à la fois la production et ses sauvegardes."
        controles:
          - id: A7.1
            question: "Les sauvegardes critiques sont immuables ou hors ligne, hors de portée des comptes d'administration courants, des comptes de service et des agents d'IA ; leur restauration est testée au moins tous les six mois."
            preuves: "Architecture de sauvegarde ; matrice des identités ayant un droit de suppression ; procès-verbaux de tests de restauration."
            methode: "Revue de configuration ; exercice"
            criticite: 3
            flash: true
            question_flash: "Existe-t-il un seul compte, humain ou agent, capable de supprimer à la fois une base de production et ses sauvegardes ?"
            refs: {nist_csf: [PR.DS-11, RC.RP-03], atlas: [AML.T0101]}
            cas: [POCKETOS]
          - id: A7.2
            question: "Des objectifs de reprise (RTO/RPO) sont définis pour les services critiques et un mode dégradé permet de mettre un service hors ligne sans arrêter l'activité."
            preuves: "Analyse d'impact ; procédures de mode dégradé ; résultats de tests."
            methode: "Revue documentaire ; entretien"
            criticite: 2
            flash: false
            refs: {nist_csf: [RC.RP-01, PR.IR-03]}
            cas: [PHP2SHELL]

      - id: A8
        titre: "Usage défensif de l'IA et boucle de remédiation"
        objectif: "Raccourcir la boucle découverte → correctif, là où se joue l'avantage du défenseur."
        controles:
          - id: A8.1
            question: "Des outils d'IA sont utilisés pour rechercher des vulnérabilités (revue de code, analyse de configuration, fuzzing assisté) sur les applications critiques, dans un cadre validé (données, fournisseurs, périmètre)."
            preuves: "Liste des outils et du périmètre ; validation sécurité et juridique ; résultats obtenus."
            methode: "Entretien ; revue documentaire"
            criticite: 2
            flash: false
            refs: {nist_csf: [ID.RA-01, ID.IM-02], nist_ai_rmf: [GOVERN 6.1]}
            cas: [PHP2SHELL, GOULOT-VALIDATION]
          - id: A8.2
            question: "Les découvertes issues d'outils d'IA passent par un circuit de tri, de déduplication et de validation humaine avant d'entrer dans le backlog de correction ; la capacité de validation est suivie."
            preuves: "Processus de tri ; indicateurs de volume, de faux positifs et de délais de validation."
            methode: "Revue documentaire ; échantillonnage"
            criticite: 2
            flash: false
            refs: {nist_csf: [RS.MA-02, ID.RA-01]}
            cas: [GOULOT-VALIDATION]
          - id: A8.3
            question: "Le délai découverte → correctif déployé est mesuré de bout en bout, fait l'objet d'un objectif et est suivi par la direction."
            preuves: "Tableau de bord ; comptes rendus de comité."
            methode: "Revue documentaire"
            criticite: 2
            flash: true
            question_flash: "Votre direction suit-elle un indicateur du délai entre la découverte d'une faille et son correctif en production ?"
            refs: {nist_csf: [GV.OV-01, ID.IM-01]}
            cas: [GOULOT-VALIDATION]

  - id: B
    titre: "Surface B — Risques agentiques"
    resume: "Les agents d'IA de l'organisation (et ceux de tiers) : ce qu'ils peuvent lire, faire, et ce qu'on peut prouver de leurs actions."
    domaines:
      - id: B1
        titre: "Gouvernance et inventaire des systèmes d'IA"
        objectif: "On ne protège pas un agent dont on ignore l'existence (shadow AI)."
        controles:
          - id: B1.1
            question: "Un registre des systèmes d'IA et des agents existe : agents internes, SaaS, copilotes, agents de code, agents de navigateur, automatisations sans code. Pour chacun : propriétaire, fournisseur, modèle, données accessibles, outils, niveau d'autonomie."
            preuves: "Registre ; comparaison avec les flux réseau vers les fournisseurs d'IA et les applications SaaS détectées."
            methode: "Revue documentaire ; test technique (découverte)"
            criticite: 3
            flash: true
            question_flash: "Pouvez-vous lister tous les agents d'IA qui agissent dans votre SI aujourd'hui, avec leurs droits et leur propriétaire ?"
            refs: {nist_ai_rmf: [GOVERN 1.6, MAP 4.1], atlas: [AML.M0023]}
            cas: [SONDAGE-GOUVERNANCE]
          - id: B1.2
