      - id: B10
        titre: "Agents tiers et externes"
        objectif: "Les agents des autres (clients, prestataires, attaquants) agissent déjà sur vos services."
        controles:
          - id: B10.1
            question: "L'organisation sait détecter et distinguer les agents d'IA tiers qui utilisent ses services (espaces clients, API, sites marchands) et applique une politique explicite : autoriser, encadrer ou bloquer."
            preuves: "Règles de gestion des robots ; statistiques d'agents détectés ; politique."
            methode: "Revue de configuration ; test technique"
            criticite: 3
            flash: true
            question_flash: "Savez-vous aujourd'hui quelle part du trafic de vos espaces clients ou de votre site provient d'agents d'IA ?"
            refs: {nist_csf: [DE.CM-01, DE.CM-06], atlas: [AML.T0116]}
            cas: [BANQUES-AGENTS, ECOM-AGENTS]
          - id: B10.2
            question: "Les parcours sensibles (virement, changement de coordonnées, création d'accès) résistent aux actions automatisées : authentification forte liée à l'action, limitation de débit, détection d'automatisation."
            preuves: "Analyse des parcours ; tests d'automatisation."
            methode: "Test technique"
            criticite: 2
            flash: false
            refs: {nist_csf: [PR.AA-03], atlas: [AML.T0012]}
            cas: [BANQUES-AGENTS]
          - id: B10.3
            question: "Les prestataires qui utilisent des agents d'IA sur vos systèmes ou vos données doivent le déclarer contractuellement (périmètre, identités, journalisation, notification d'incident)."
            preuves: "Clauses contractuelles ; questionnaires prestataires."
            methode: "Revue documentaire"
            criticite: 2
            flash: false
            refs: {nist_ai_rmf: [GOVERN 6.1, MANAGE 3.1], nist_csf: [GV.SC-05]}
            cas: []
          - id: B10.4
            question: "Les conditions d'utilisation encadrent l'usage d'agents automatisés par les clients : responsabilité, identification des agents, actions interdites."
            preuves: "Conditions générales ; politique d'accès programmatique."
            methode: "Revue documentaire"
            criticite: 1
            flash: false
            refs: {nist_ai_rmf: [GOVERN 1.1]}
            cas: [BANQUES-AGENTS]

      - id: B11
        titre: "Cycle de vie et tests des applications d'IA"
        objectif: "Tester les agents comme un attaquant le ferait, avant et après chaque changement."
        controles:
          - id: B11.1
            question: "Chaque agent ou application LLM fait l'objet d'une modélisation des menaces avant mise en production : flux de données, frontières de confiance, outils, privilèges."
            preuves: "Analyses de risques ; diagrammes de flux."
            methode: "Revue documentaire"
            criticite: 3
            flash: false
            refs: {nist_ai_rmf: [MAP 4.1, MAP 4.2], owasp_asi: [ASI01, ASI02, ASI03]}
            cas: []
          - id: B11.2
            question: "Un red teaming IA est réalisé avant mise en production puis périodiquement, par une équipe indépendante des développeurs, avec des scénarios alignés sur OWASP et MITRE ATLAS."
            preuves: "Rapports de red teaming ; suivi des corrections."
            methode: "Revue documentaire"
            criticite: 2
            flash: false
            refs: {nist_ai_rmf: [MEASURE 1.3, MEASURE 2.7], nist_csf: [ID.IM-02], atlas: [AML.M0035]}
            cas: []
          - id: B11.3
            question: "Tout changement de modèle, de prompt système, d'outil ou de mémoire déclenche une réévaluation : tests de non-régression de sécurité et jeux d'évaluation."
            preuves: "Processus de changement ; résultats de non-régression."
            methode: "Revue documentaire ; échantillonnage"
            criticite: 2
            flash: false
            refs: {nist_ai_rmf: [MANAGE 3.2, MEASURE 2.7]}
            cas: []
          - id: B11.4
            question: "Le code produit par des assistants d'IA suit le même processus de revue et d'analyse (SAST, analyse de composition, détection de secrets) que le code humain, et son origine est tracée."
            preuves: "Politique de développement ; configuration des contrôles CI."
            methode: "Revue de configuration"
            criticite: 2
            flash: false
            refs: {nist_csf: [PR.PS-06], owasp_asi: [ASI05]}
            cas: []
          - id: B11.5
            question: "Les modèles et artefacts (poids, gabarits, jeux de données) proviennent de sources vérifiées, avec contrôle d'intégrité et analyse des formats dangereux (sérialisation pickle, par exemple)."
            preuves: "Registre des modèles ; contrôles d'intégrité."
            methode: "Revue documentaire ; test technique"
            criticite: 1
            flash: false
            refs: {owasp_llm: ["LLM03:2025", "LLM04:2025"], atlas: [AML.T0010.003, AML.T0011.000, AML.M0014]}
            cas: []

      - id: B12
        titre: "Facteur humain et confiance"
        objectif: "L'humain dans la boucle n'est un garde-fou que s'il garde son esprit critique."
        controles:
          - id: B12.1
            question: "Les collaborateurs sont formés aux risques propres aux agents (injection via des contenus, excès de confiance, validation par habitude) et aux fraudes assistées par IA (hameçonnage ciblé, hypertrucages vocaux ou vidéo)."
            preuves: "Programme de sensibilisation ; taux de participation ; résultats d'exercices."
            methode: "Revue documentaire"
            criticite: 2
            flash: false
            refs: {owasp_asi: [ASI09], nist_csf: [PR.AT-01], atlas: [AML.T0052.000, AML.T0088, AML.M0018]}
            cas: []
          - id: B12.2
            question: "Les écrans de validation humaine présentent l'action exacte et ses conséquences ; un résumé rédigé par l'agent lui-même ne sert jamais de seule base de décision."
            preuves: "Captures des écrans de validation ; tests."
            methode: "Test technique"
            criticite: 2
            flash: false
            refs: {owasp_asi: [ASI09], atlas: [AML.M0029]}
            cas: [AISI-2026-07]
          - id: B12.3
            question: "Une vérification hors bande (rappel sur un numéro connu) est imposée pour les demandes sensibles : paiement, changement de coordonnées bancaires, octroi d'accès."
            preuves: "Procédures ; contrôles par échantillonnage."
            methode: "Revue documentaire ; échantillonnage"
            criticite: 1
            flash: false
            refs: {owasp_asi: [ASI09], atlas: [AML.T0073]}
            cas: []
