name: Agent Lab — build, test and preview

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'tests/test_lab.py'
      - 'profile-block.md'
      - 'requirements-dev.txt'
      - '.github/workflows/agent-lab.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: agent-lab-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the current profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install development tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Build the standalone site
        run: python tools/build.py
      - name: Run interface regression tests
        run: python tests/test_lab.py
      - name: Render the animated and static previews
        run: python tools/render_preview.py
      - name: Insert the Lab without replacing existing profile content
        run: python tools/update_readme.py
      - name: Commit the generated site and profile preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html docs/.nojekyll assets/agent-lab-preview.webp assets/agent-lab-preview.png README.md tests/last-report.json
          if git diff --cached --quiet; then
            echo 'Generated files already up to date.'
          else
            git commit -m 'chore: build Agent Lab site and animated profile preview [skip ci]'
            git push origin HEAD:main
          fi
      - name: Request a Pages build when Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh api "repos/${GH_REPO}/pages" >/dev/null 2>&1; then
            gh api --method POST "repos/${GH_REPO}/pages/builds" >/dev/null
            echo 'Requested a GitHub Pages build.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Site and preview committed. Enable Pages in Settings > Pages > Deploy from a branch > main > /docs.' >> "$GITHUB_STEP_SUMMARY"
          fi
